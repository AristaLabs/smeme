name: One-shot — grant smeme-cloud GHCR pull access

# Links private ghcr.io/aristalabs/smeme to AristaLabs/smeme-cloud so Cloud CI
# can docker pull the digest-pinned Core image with GITHUB_TOKEN.

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  grant:
    name: Grant smeme-cloud package access
    runs-on: ubuntu-latest
    steps:
      - name: Connect smeme-cloud to Core package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_ID=$(gh api repos/AristaLabs/smeme-cloud --jq .id)
          echo "smeme-cloud id=$REPO_ID"
          gh api -X PUT \
            "orgs/AristaLabs/packages/container/smeme/repositories/${REPO_ID}" \
            -H "Accept: application/vnd.github+json"
          echo "Linked repositories:"
          gh api "orgs/AristaLabs/packages/container/smeme/repositories" \
            --jq '.[].full_name'
