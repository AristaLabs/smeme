name: Core CI / GHCR

# Public AristaLabs/smeme pipeline:
# - PRs / main pushes → CI + Core boundary checks
# - main pushes → publish staging Core image (sha-… + staging-latest; never :latest)
# - Version tags v*.*.* → publish release Core image (semver + :latest)
# - Every publish attests the exact digest (SLSA + CycloneDX) via GitHub OIDC
#
# Theory citation tags (decision-dag-algebra-v*) are orthogonal to v*.*.* image
# tags — see docs/guides/decision-dag-algebra-maintenance.md. Do not use theory
# tags as GHCR publish triggers.
#
# Image identity (both tracks):
#   io.smeme.core.version  — last release lineage (vMAJOR.MINOR.PATCH)
#   io.smeme.core.ref      — published tag (v… or sha-<fullsha>)
#   io.smeme.core.channel  — release | staging
# Digest is always authoritative; channel=staging means post-release tip for
# Cloud staging pins, not a Core hosted environment.
#
# Intentionally omits SaaS dual-stage / Render deploy jobs.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image paths
  IMAGE_NAME: aristalabs/smeme

jobs:
  ci:
    name: Core CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.8.2"
          enable-cache: true

      - name: Install dependencies (Core + dev)
        run: uv sync --extra dev

      - name: §10.2 product-path gate (no legacy DTQ tokens)
        run: uv run python scripts/check_no_dtq_product_refs.py

      - name: D024 retired-namespace source gate
        run: uv run python scripts/check_no_qnr_product_refs.py

      - name: Product vocabulary (decision-tree copy)
        run: uv run python scripts/check_product_vocabulary.py

      - name: Core operator env drift (compose ↔ docs ↔ Settings)
        run: uv run python scripts/check_core_operator_env_drift.py

      - name: Core entrypoint must not import SAAS-ONLY modules (D023)
        run: uv run python scripts/check_core_no_saas_imports.py

      - name: Core appliance image boundary
        run: |
          docker build -f Dockerfile.core -t smeme:ci .
          uv run python scripts/check_core_no_saas_imports.py --image smeme:ci
          uv run python scripts/check_no_qnr_product_refs.py --image smeme:ci
          docker run --rm --entrypoint /bin/sh smeme:ci -c \
            'test -f /app/legal/LICENSE.md && test -f /app/legal/THIRD_PARTY_NOTICES.md'

      - name: Core self-host artifacts present
        run: |
          test -f Dockerfile.core
          test -f start-core.sh
          test -f docker-compose.core.yml
          test -f docker-compose.core.build.yml
          test -f docker-compose.core.prod.yml
          test -x scripts/init_core_env.sh
          test -f deploy/caddy/Caddyfile
          test -f docs/guides/self-host-env.md
          test -f docs/guides/self-host-pilot.md
          test -f smeme/core_entrypoint.py
          test ! -f smeme/main.py
          test ! -f smeme/saas_overlay.py
          test -f CONTRIBUTING.md
          test -f LICENSE.md
          test -f THIRD_PARTY_NOTICES.md
          test -f LICENSING.md
          ! grep -q 'private monorepo' LICENSE.md
          ! grep -q 'SaaS-only / private overlay' LICENSE.md
          ! grep -E '^\s+build:' docker-compose.core.yml

      - name: Run linter
        run: uv run ruff check smeme

      - name: Run formatter check
        run: uv run ruff format --check smeme

      - name: Check Alembic revision integrity
        run: |
          HEADS=$(uv run alembic heads | wc -l)
          if [ "$HEADS" -gt 1 ]; then
            echo "ERROR: Multiple Alembic heads detected!"
            uv run alembic heads
            exit 1
          fi

      - name: Validate agent skills
        run: uv run python scripts/validate_agent_skills.py

      - name: Verify guidance artifact is fresh
        run: uv run python scripts/build_guidance_artifact.py --check

      - name: Verify design guidance artifact is fresh
        run: uv run python scripts/build_design_guidance_artifact.py --check

      - name: Agent skills validator unit tests
        env:
          SECRET_KEY: github-actions-ci-secret-key-min-32-chars!!
          JWT_SECRET_KEY: github-actions-ci-jwt-secret-key-min-32b!
          DATABASE_URL: postgresql+asyncpg://smeme:smeme@localhost:5432/smeme_ci
          OPENAI_API_KEY: sk-ci-placeholder-not-used-by-validator-unit-tests
        run: uv run pytest tests/unit/test_validate_agent_skills.py -q

  alembic-drift:
    name: Alembic model drift + golden matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smeme
          POSTGRES_PASSWORD: smeme
          POSTGRES_DB: smeme_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smeme -d smeme_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://smeme:smeme@localhost:5432/smeme_ci
      SECRET_KEY: github-actions-ci-secret-key-min-32-chars!!
      JWT_SECRET_KEY: github-actions-ci-jwt-secret-key-min-32b!
      OPENAI_API_KEY: sk-ci-placeholder-not-used-by-alembic-drift
      RUN_ALEMBIC_DRIFT: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.8.2"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check Alembic autogenerate drift
        run: bash scripts/check_alembic_no_drift.sh

      - name: Golden matrix regression tests
        run: uv run pytest -m golden_matrix -q

      - name: Full Core test suite
        run: uv run pytest -q

  publish-staging:
    name: Publish staging Core image to GHCR
    runs-on: ubuntu-latest
    needs: [ci, alembic-drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    concurrency:
      group: core-ghcr-publish
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Resolve staging identity
        id: identity
        run: |
          set -euo pipefail
          LINEAGE=$(git describe --tags --match 'v*.*.*' --abbrev=0 2>/dev/null || true)
          if [[ ! "$LINEAGE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot resolve Core release lineage (need an ancestor vMAJOR.MINOR.PATCH tag)"
            exit 1
          fi
          REF="sha-${GITHUB_SHA}"
          echo "version=$LINEAGE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "channel=staging" >> "$GITHUB_OUTPUT"
          echo "Core staging identity: version=$LINEAGE ref=$REF channel=staging"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=staging-latest
          labels: |
            io.smeme.core.version=${{ steps.identity.outputs.version }}
            io.smeme.core.ref=${{ steps.identity.outputs.ref }}
            io.smeme.core.channel=${{ steps.identity.outputs.channel }}

      - name: Build and push Core staging image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.core
          push: true
          # Buildx OCI attestations previously 403'd on GHCR empty blobs.
          # Signed SBOM + SLSA provenance are attached after push via
          # actions/attest (GitHub OIDC / Sigstore) for the exact digest.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest published digest
        uses: ./.github/actions/attest-published-image
        with:
          image-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.build.outputs.digest }}
          evidence-name: core-release-evidence-${{ steps.identity.outputs.ref }}

      - name: Record digest
        run: |
          echo "Published ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.identity.outputs.ref }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          echo "Lineage: ${{ steps.identity.outputs.version }}"
          echo "Channel: ${{ steps.identity.outputs.channel }}"
          echo "::notice::Core staging ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.identity.outputs.ref }}@${{ steps.build.outputs.digest }} (lineage ${{ steps.identity.outputs.version }})"
          echo "::notice::Verify: gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} --repo ${{ github.repository }}"

  publish:
    name: Publish release Core image to GHCR
    runs-on: ubuntu-latest
    needs: [ci, alembic-drift]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    concurrency:
      group: core-ghcr-publish
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: tag
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/}
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must be vMAJOR.MINOR.PATCH (got $VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=release" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}
          labels: |
            io.smeme.core.version=${{ steps.tag.outputs.version }}
            io.smeme.core.ref=${{ steps.tag.outputs.ref }}
            io.smeme.core.channel=${{ steps.tag.outputs.channel }}

      - name: Build and push Core image (linux/amd64 + linux/arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.core
          push: true
          platforms: linux/amd64,linux/arm64
          # Buildx OCI attestations previously 403'd on GHCR empty blobs.
          # Signed SBOM + SLSA provenance are attached after push via
          # actions/attest (GitHub OIDC / Sigstore) for the exact digest.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record multi-arch manifests
        id: manifests
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          echo "Index/manifest digest from build-push: $DIGEST"
          docker buildx imagetools inspect "$IMG" > /tmp/imagetools.txt
          cat /tmp/imagetools.txt
          # Per-arch digests when present (honest evidence; may be platform descriptors).
          {
            echo "image=$IMG"
            echo "index_digest=$DIGEST"
            echo "platforms=linux/amd64,linux/arm64"
          } >> "$GITHUB_OUTPUT"

      - name: Attest published digest
        id: evidence
        uses: ./.github/actions/attest-published-image
        with:
          image-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.build.outputs.digest }}
          evidence-name: core-release-evidence-${{ steps.tag.outputs.version }}

      - name: Attach evidence to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          body: |
            ## Core image ${{ steps.tag.outputs.version }}

            ```
            Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            Digest: ${{ steps.build.outputs.digest }}
            Platforms: linux/amd64, linux/arm64
            Channel: ${{ steps.tag.outputs.channel }}
            ```

            ### Supply-chain evidence

            - GitHub Attestations (SLSA provenance + CycloneDX SBOM) are bound to this digest
            - Release assets below retain the evidence pack for the source-offer period
            - Verify:
              `gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} --repo ${{ github.repository }}`
          # Keep this list aligned with scripts/write_core_release_checksums.sh.
          # legal-bundle stays only in the 90-day workflow artifact.
          files: |
            ${{ steps.evidence.outputs.cdx-path }}
            ${{ steps.evidence.outputs.evidence-dir }}/sbom/smeme.spdx.json
            ${{ steps.evidence.outputs.evidence-dir }}/sbom/smeme.source.txt
            ${{ steps.evidence.outputs.checksums-path }}
            ${{ steps.evidence.outputs.evidence-dir }}/EVIDENCE.txt
            ${{ steps.evidence.outputs.evidence-dir }}/COSIGN.md

      - name: Record digest
        run: |
          echo "Published ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          echo "Platforms: linux/amd64,linux/arm64"
          echo "Channel: ${{ steps.tag.outputs.channel }}"
          echo "::notice::Core release ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}@${{ steps.build.outputs.digest }}"
          echo "::notice::Verify: gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} --repo ${{ github.repository }}"

  anonymous-pull:
    name: Anonymous GHCR pull (post-publish)
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Anonymous pull without registry login
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE: ghcr.io/aristalabs/smeme
        run: |
          set -euo pipefail
          docker logout ghcr.io 2>/dev/null || true
          export DOCKER_CONFIG="$(mktemp -d)"
          echo '{}' > "$DOCKER_CONFIG/config.json"
          # No docker login — public package must pull anonymously.
          docker pull "${IMAGE}:${VERSION}"
          docker image inspect "${IMAGE}:${VERSION}" --format '{{.Id}} {{index .RepoDigests 0}}'
          echo "::notice::Anonymous pull OK for ${IMAGE}:${VERSION}"
