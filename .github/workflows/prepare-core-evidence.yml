name: Prepare Core release evidence

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image reference'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ inputs.image }}

      - name: Record digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ inputs.image }} | sed 's/.*@//')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Digest: $DIGEST"

      - name: Install uv
        run: pip install uv

      - name: Prepare evidence pack
        run: |
          mkdir -p build/release-evidence
          bash scripts/prepare_core_release_evidence.sh "${{ inputs.image }}" build/release-evidence
          ls -laR build/release-evidence | head -80

      - name: Derive artifact name
        id: artifact
        env:
          IMAGE_REF: ${{ inputs.image }}
        run: |
          SAFE_SUFFIX="$(printf '%s' "${IMAGE_REF##*:}" | tr -c 'A-Za-z0-9._-' '-')"
          echo "name=core-release-evidence-${SAFE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/release-evidence
          retention-days: 90
