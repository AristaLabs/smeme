name: Prepare Core release evidence

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image reference'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ inputs.image }}

      - name: Record digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ inputs.image }} | sed 's/.*@//')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Digest: $DIGEST"

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v6.1.0
        with:
          version: "0.8.2"
          enable-cache: true

      - name: Prepare evidence pack
        run: |
          mkdir -p build/release-evidence
          bash scripts/prepare_core_release_evidence.sh "${{ inputs.image }}" build/release-evidence
          # Avoid SIGPIPE+pipefail from `ls | head` closing the pipe early.
          find build/release-evidence -type f | sort | head -80 || true

      - name: Derive artifact name
        id: artifact
        env:
          IMAGE_REF: ${{ inputs.image }}
        run: |
          SAFE_SUFFIX="$(printf '%s' "${IMAGE_REF##*:}" | tr -c 'A-Za-z0-9._-' '-')"
          echo "name=core-release-evidence-${SAFE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/release-evidence
          # Ad-hoc packs only. Publish CI attests digests and attaches release
          # assets for durable retention (see legal/SOURCE_OFFER.md).
          retention-days: 90
