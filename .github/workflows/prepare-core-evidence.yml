name: Prepare Core release evidence

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image reference'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ inputs.image }}

      - name: Record digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ inputs.image }} | sed 's/.*@//')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Digest: $DIGEST"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.8.2"
          enable-cache: true

      - name: Prepare evidence pack
        run: |
          mkdir -p build/release-evidence
          bash scripts/prepare_core_release_evidence.sh "${{ inputs.image }}" build/release-evidence
          # Avoid SIGPIPE+pipefail from `ls | head` closing the pipe early.
          find build/release-evidence -type f | sort | head -80 || true

      - name: Derive artifact name
        id: artifact
        env:
          IMAGE_REF: ${{ inputs.image }}
        run: |
          SAFE_SUFFIX="$(printf '%s' "${IMAGE_REF##*:}" | tr -c 'A-Za-z0-9._-' '-')"
          echo "name=core-release-evidence-${SAFE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/release-evidence
          # Ad-hoc packs only. Publish CI attests digests and attaches release
          # assets for durable retention (see legal/SOURCE_OFFER.md).
          retention-days: 90
