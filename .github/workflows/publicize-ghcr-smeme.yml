name: One-shot — publicize GHCR smeme package

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publicize:
    runs-on: ubuntu-latest
    steps:
      - name: Set smeme package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Before:"
          gh api orgs/AristaLabs/packages/container/smeme --jq '{name,visibility,repository:.repository.full_name}'

          # Docs: Set package visibility (org)
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            orgs/AristaLabs/packages/container/smeme/visibility \
            -f visibility=public \
            && echo "visibility POST ok" || echo "visibility POST failed"

          # Alternate: GraphQL updatePackage
          gh api graphql -f query='
            mutation($packageId:ID!,$visibility:PackageVisibility!){
              updatePackage(input:{packageId:$packageId, visibility:$visibility}) {
                package { name visibility }
              }
            }' -f packageId="$(gh api orgs/AristaLabs/packages/container/smeme --jq .id)" -f visibility=PUBLIC \
            && echo "graphql ok" || echo "graphql failed"

          echo "After:"
          gh api orgs/AristaLabs/packages/container/smeme --jq '{name,visibility,html_url}'
