# Self-host Core stack (D023). Build with Dockerfile.core.
#
#   cp .env.core.example .env.core   # then edit secrets
#   docker compose --env-file .env.core -f docker-compose.core.yml up --build
#
# This compose file runs the self-hosted Core image.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smeme
      POSTGRES_PASSWORD: smeme
      POSTGRES_DB: smeme
    ports:
      - "5432:5432"
    volumes:
      - smeme_core_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smeme -d smeme"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.core
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smeme:smeme@db:5432/smeme
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:8000"]}

      # AI generation (optional)
      SMEME_AI_GENERATION_ENABLED: ${SMEME_AI_GENERATION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SHOW_QNR_GENERATION_REGION_SELECTOR: ${SHOW_QNR_GENERATION_REGION_SELECTOR:-true}

      # Clerk / OIDC profile
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SIGN_IN_URL: ${CLERK_SIGN_IN_URL:-}
      CLERK_SIGN_UP_URL: ${CLERK_SIGN_UP_URL:-}
      CLERK_SIGN_OUT_URL: ${CLERK_SIGN_OUT_URL:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      CLERK_OAUTH_ISSUER: ${CLERK_OAUTH_ISSUER:-}
      CLERK_OAUTH_DYNAMIC_REGISTRATION: ${CLERK_OAUTH_DYNAMIC_REGISTRATION:-false}

      # MCP
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_HTTP_PATH: ${MCP_HTTP_PATH:-/api/v1/mcp}
      MCP_AUTHORING_GRAPH_TOOLS_ENABLED: ${MCP_AUTHORING_GRAPH_TOOLS_ENABLED:-true}
      SMEME_MCP_ALLOWED_OAUTH_CLIENT_IDS: ${SMEME_MCP_ALLOWED_OAUTH_CLIENT_IDS:-}
      SMEME_MCP_OAUTH_ACCESS_TOKEN_AUDIENCE: ${SMEME_MCP_OAUTH_ACCESS_TOKEN_AUDIENCE:-}
      SMEME_MCP_TRANSPORT_RATE_LIMIT_PER_IP_PER_MINUTE: ${SMEME_MCP_TRANSPORT_RATE_LIMIT_PER_IP_PER_MINUTE:-120}
      SMEME_MCP_TRANSPORT_RATE_LIMIT_PER_SUB_PER_MINUTE: ${SMEME_MCP_TRANSPORT_RATE_LIMIT_PER_SUB_PER_MINUTE:-240}
      MCP_INVOCATION_TELEMETRY_ENABLED: ${MCP_INVOCATION_TELEMETRY_ENABLED:-true}
      MCP_INVOCATION_TELEMETRY_PERSIST: ${MCP_INVOCATION_TELEMETRY_PERSIST:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  smeme_core_pg:
