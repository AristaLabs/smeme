# Self-host Core stack (D023) — operator pull-first path.
#
#   ./scripts/init_core_env.sh
#   docker compose --env-file .env.core -f docker-compose.core.yml pull
#   docker compose --env-file .env.core -f docker-compose.core.yml up -d --no-build --wait
#
# Contributors (build from source):
#   docker compose --env-file .env.core \
#     -f docker-compose.core.yml -f docker-compose.core.build.yml up -d --build
#
# Production TLS:
#   docker compose --env-file .env.core \
#     -f docker-compose.core.yml -f docker-compose.core.prod.yml up -d --no-build
#
# H-07: no predictable secret fallbacks; DB has no host port; web binds 127.0.0.1.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smeme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via scripts/init_core_env.sh}
      POSTGRES_DB: smeme
    # Intentionally not published on the host. Use:
    #   docker compose --env-file .env.core -f docker-compose.core.yml exec db \
    #     psql -U smeme -d smeme
    volumes:
      - smeme_core_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smeme -d smeme"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${SMEME_CORE_IMAGE:?Set SMEME_CORE_IMAGE in .env.core (see .env.core.example)}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://smeme:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via scripts/init_core_env.sh}@db:5432/smeme
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY via scripts/init_core_env.sh}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY via scripts/init_core_env.sh}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SQLALCHEMY_LOG_LEVEL: ${SQLALCHEMY_LOG_LEVEL:-WARNING}
      BASE_URL: ${BASE_URL:-http://127.0.0.1:8000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://127.0.0.1:8000","http://localhost:8000"]}

      # AI generation wizard (optional; independent of MCP authoring)
      SMEME_AI_GENERATION_ENABLED: ${SMEME_AI_GENERATION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SHOW_DECISION_TREE_GENERATION_REGION_SELECTOR: ${SHOW_DECISION_TREE_GENERATION_REGION_SELECTOR:-true}

      # Clerk (turnkey AS for browser + MCP OAuth)
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SIGN_IN_URL: ${CLERK_SIGN_IN_URL:-}
      CLERK_SIGN_UP_URL: ${CLERK_SIGN_UP_URL:-}
      CLERK_SIGN_OUT_URL: ${CLERK_SIGN_OUT_URL:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      CLERK_OAUTH_ISSUER: ${CLERK_OAUTH_ISSUER:-}
      CLERK_OAUTH_DYNAMIC_REGISTRATION: ${CLERK_OAUTH_DYNAMIC_REGISTRATION:-false}

      # MCP
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_HTTP_PATH: ${MCP_HTTP_PATH:-/api/v1/mcp}
      MCP_AUTHORING_GRAPH_TOOLS_ENABLED: ${MCP_AUTHORING_GRAPH_TOOLS_ENABLED:-true}
      SMEME_MCP_ALLOWED_OAUTH_CLIENT_IDS: ${SMEME_MCP_ALLOWED_OAUTH_CLIENT_IDS:-}
      SMEME_MCP_OAUTH_ACCESS_TOKEN_AUDIENCE: ${SMEME_MCP_OAUTH_ACCESS_TOKEN_AUDIENCE:-}
      SMEME_MCP_TRANSPORT_RATE_LIMIT_PER_IP_PER_MINUTE: ${SMEME_MCP_TRANSPORT_RATE_LIMIT_PER_IP_PER_MINUTE:-120}
      SMEME_MCP_TRANSPORT_RATE_LIMIT_PER_SUB_PER_MINUTE: ${SMEME_MCP_TRANSPORT_RATE_LIMIT_PER_SUB_PER_MINUTE:-240}
      MCP_INVOCATION_TELEMETRY_ENABLED: ${MCP_INVOCATION_TELEMETRY_ENABLED:-true}
      MCP_INVOCATION_TELEMETRY_PERSIST: ${MCP_INVOCATION_TELEMETRY_PERSIST:-true}

      # First-user provision (web callback and/or MCP-first)
      MCP_FIRST_PROVISIONING_ENABLED: ${MCP_FIRST_PROVISIONING_ENABLED:-false}
      SMEME_MCP_FIRST_PROVISION_RATE_LIMIT_PER_IP_PER_MINUTE: ${SMEME_MCP_FIRST_PROVISION_RATE_LIMIT_PER_IP_PER_MINUTE:-10}
      SMEME_MCP_FIRST_PROVISION_RATE_LIMIT_PER_SUB_PER_MINUTE: ${SMEME_MCP_FIRST_PROVISION_RATE_LIMIT_PER_SUB_PER_MINUTE:-5}
      SMEME_LEGAL_TERMS_URL: ${SMEME_LEGAL_TERMS_URL:-}
      SMEME_LEGAL_PRIVACY_URL: ${SMEME_LEGAL_PRIVACY_URL:-}
      SMEME_LEGAL_TERMS_VERSION: ${SMEME_LEGAL_TERMS_VERSION:-}
      SMEME_LEGAL_PRIVACY_VERSION: ${SMEME_LEGAL_PRIVACY_VERSION:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  smeme_core_pg:
