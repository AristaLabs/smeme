{% from "components/macros.html" import callout %}
<div class="fixed inset-0 z-50 flex items-center justify-center bg-ui-ink/50 p-4"
     id="delete-account-modal-dialog"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-account-phrase-title">
  <div class="w-full max-w-lg rounded-xl border border-ui-line bg-ui-surface p-6 shadow-card-hover">
    <h3 id="delete-account-phrase-title" class="text-lg font-semibold text-ui-ink">
      Confirm permanent deletion
    </h3>
    <p class="mt-2 text-sm text-ui-ink-secondary">
      Type <strong class="font-medium text-ui-ink">{{ confirm_phrase }}</strong> to delete your account.
    </p>

    {% if error_message %}
    {% call callout("error", variant="compact", extra_class="mt-3 mb-0") %}
      {{ error_message }}
    {% endcall %}
    {% endif %}

    <form class="mt-4 space-y-4"
          data-delete-account-form
          hx-post="/auth/profile/delete-account"
          hx-target="#delete-account-modal"
          hx-swap="innerHTML">
      <div>
        <label for="delete-account-phrase-input" class="sr-only">Confirmation phrase</label>
        <input id="delete-account-phrase-input"
               name="confirm_phrase"
               type="text"
               autocomplete="off"
               spellcheck="false"
               placeholder="{{ confirm_phrase }}"
               data-delete-account-phrase-input
               data-confirm-phrase="{{ confirm_phrase }}"
               class="w-full rounded-lg border border-ui-line-strong bg-ui-surface px-3 py-2 text-sm text-ui-ink placeholder:text-ui-ink-subtle focus:border-danger-500 focus:outline-none focus:ring-1 focus:ring-danger-500">
      </div>

      <div class="flex flex-wrap justify-end gap-3">
        <button type="button"
                data-dismiss-modal="delete-account-modal"
                class="inline-flex items-center justify-center rounded-lg border border-ui-line-strong bg-ui-surface px-4 py-2 text-sm font-semibold text-ui-ink-secondary hover:bg-ui-surface-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2">
          Cancel
        </button>
        <button id="delete-account-submit-btn"
                type="submit"
                disabled
                class="inline-flex items-center justify-center rounded-lg bg-danger-600 px-4 py-2 text-sm font-semibold text-white hover:bg-danger-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-danger-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
          Delete my account
        </button>
      </div>
    </form>
  </div>
</div>
<script src="/static/js/delete-account-confirm.js"></script>
