{# Deploy status chip — matches dashboard Tools column (Live / Stale only; not deployed → use Deploy button). #}
{% set tr = tools_row_state|default('not_built') %}
{% if tr == 'live' %}
<span class="inline-flex items-center rounded-full bg-emerald-50 dark:bg-emerald-950/40 px-2.5 py-0.5 text-xs font-medium text-emerald-800 dark:text-emerald-200 ring-1 ring-emerald-600/15"
      title="Your workflow is deployed and up to date.">
  Live
</span>
{% elif tr == 'stale' %}
<span class="inline-flex items-center rounded-full bg-amber-50 dark:bg-amber-950/40 px-2.5 py-0.5 text-xs font-medium text-amber-900 dark:text-amber-200 ring-1 ring-amber-600/20"
      title="Recent edits are not live on MCP until you redeploy. Connected AI tools are still using the previous deploy.">
  Stale
</span>
{% endif %}
