<div class="graph-legend-panel pointer-events-none rounded-lg border border-ui-line bg-ui-surface/95 p-3 text-xs text-ui-ink-muted shadow-sm backdrop-blur-sm">
  <div class="mb-2 font-semibold text-ui-ink-secondary">Legend</div>
  <div class="grid grid-cols-1 gap-1.5">
    <div class="flex items-center gap-2">
      <span class="inline-block h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
      <span>Start node</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="inline-block h-2.5 w-2.5 rounded-full bg-blue-500"></span>
      <span>Selected node</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="inline-block h-[2px] w-5 bg-amber-500"></span>
      <span>Conditional edge</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="inline-block h-[2px] w-5 rounded-full" style="background-color: var(--ui-graph-edge);"></span>
      <span>Default edge</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="inline-block h-2.5 w-2.5 rounded-full bg-[#002868]"></span>
      <span>Conclusion node</span>
    </div>
  </div>
</div>
