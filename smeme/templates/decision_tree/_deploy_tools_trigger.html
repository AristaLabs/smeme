{# Opens the same deploy modal as the editor. Optional return_next: mcp | dashboard | editor #}
{% from "components/macros.html" import deploy_button_title %}
{% set rn = return_next if (return_next is defined and return_next) else '' %}
{% set qs = ('?return_next=' ~ rn) if rn else '' %}
<button type="button"
        class="deploy-flow-btn group relative inline-flex items-center justify-center gap-1.5 rounded-md border border-transparent text-left {{ deploy_extra_class|default('') }}"
        hx-get="/decision-trees/editor/{{ deploy_decision_tree_id }}/publish-modal{{ qs }}"
        hx-target="#modal-container"
        hx-swap="innerHTML"
        hx-indicator="find .deploy-flow-spinner"
        title="{{ (deploy_title|default(deploy_button_title()))|e }}">
  <span class="deploy-flow-label relative z-[1] font-medium">{{ deploy_label }}</span>
  <span class="deploy-flow-spinner htmx-indicator pointer-events-none absolute inset-0 z-[2] inline-flex items-center justify-center rounded-[inherit] bg-[inherit]" aria-hidden="true">
    <svg class="h-4 w-4 animate-spin text-current opacity-90" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
  </span>
</button>
