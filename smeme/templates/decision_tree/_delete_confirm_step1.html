<div class="fixed inset-0 z-50 flex items-center justify-center bg-ui-ink/50 p-4"
     id="delete-confirmation-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-confirm-title">
  <div class="w-full max-w-lg rounded-xl border border-ui-line bg-ui-surface p-6 shadow-card-hover">
    <div class="flex items-start gap-4">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-danger-50 text-danger-700 ring-1 ring-danger-600/15">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </div>
      <div class="min-w-0 flex-1">
        <h3 id="delete-confirm-title" class="text-lg font-semibold text-ui-ink">
          Delete decision tree permanently?
        </h3>
        <p class="mt-2 text-sm text-ui-ink-secondary">
          This removes <strong class="font-medium text-ui-ink">{{ decision_tree.title }}</strong> and all
          <strong class="font-medium text-ui-ink">{{ version_count }}</strong> version(s), deployed tools,
          and evaluation history from your account.
        </p>
        <ul class="mt-3 list-disc space-y-1 pl-5 text-sm text-ui-ink-secondary">
          <li>MCP-connected agents will no longer list or evaluate this decision tree</li>
          <li>This cannot be undone</li>
        </ul>
      </div>
    </div>

    <div class="mt-6 flex flex-wrap justify-end gap-3">
      <button type="button"
              data-dismiss-modal="delete-modal"
              class="inline-flex items-center justify-center rounded-lg border border-ui-line-strong bg-ui-surface px-4 py-2 text-sm font-semibold text-ui-ink-secondary hover:bg-ui-surface-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2">
        Cancel
      </button>
      <button type="button"
              hx-get="/decision-trees/{{ decision_tree.id }}/delete-confirm-phrase"
              hx-target="#delete-modal"
              hx-swap="innerHTML"
              class="inline-flex items-center justify-center rounded-lg bg-danger-600 px-4 py-2 text-sm font-semibold text-white hover:bg-danger-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-danger-500 focus-visible:ring-offset-2">
        Continue
      </button>
    </div>
  </div>
</div>
