{% extends "layouts/base.html" %}
{% block title %}{{ decision_tree_title }} - Editor - SMEme{% endblock %}

{% block head %}
<style>
  .editor-shell {
    --editor-nav-height: 5.5rem;
    --editor-toolbar-height: 8rem;
    --editor-status-height: 2.75rem;
    --editor-chrome-height: calc(
      var(--editor-nav-height) + var(--editor-toolbar-height) + var(--editor-status-height) + 2rem
    );
  }

  .editor-layout {
    display: flex;
    min-height: max(480px, calc(100dvh - var(--editor-chrome-height)));
    gap: 0;
  }

  .editor-graph {
    flex: 1;
    min-width: 300px;
    min-height: 0;
  }

  .editor-canvas-pane {
    max-height: calc(100dvh - var(--editor-chrome-height));
  }

  .editor-divider {
    width: 8px;
    background: var(--ui-surface-hover);
    cursor: col-resize;
    position: relative;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .editor-divider:hover {
    background: var(--ui-line);
  }

  .editor-divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 3px;
    height: 40px;
    background: var(--ui-line-strong);
    border-radius: 2px;
  }

  .editor-sidebar {
    width: {{ editor_sidebar_width|default(384) }}px;
    min-width: 280px;
    max-width: 800px;
    flex-shrink: 0;
  }

  body.resizing-editor * {
    user-select: none !important;
    cursor: col-resize !important;
  }

  .dt-graph {
    display: block;
    max-width: none;
    /* width/height set by editorGraphZoom from data-graph-width/height */
  }

  .dt-graph .graph-edge--default {
    stroke: var(--ui-graph-edge);
    stroke-width: 2;
  }

  .dt-graph .graph-edge--conditional {
    stroke: #f59e0b;
    stroke-width: 2;
  }

  .dt-graph .graph-edge--highlighted {
    stroke: #3b82f6;
    stroke-width: 3;
  }

  .dt-graph .graph-edge-arrow--default {
    fill: var(--ui-graph-edge);
  }

  .dt-graph .graph-edge-arrow--conditional {
    fill: #f59e0b;
  }

  .dt-graph .graph-edge-arrow--highlighted {
    fill: #3b82f6;
  }

  /* Legend stays pinned to the visible graph pane while SVG scrolls */
  #view-graph .graph-legend-sticky {
    position: sticky;
    top: 0.75rem;
    z-index: 10;
    height: 0;
    width: 100%;
    pointer-events: none;
  }

  #view-graph .graph-legend-panel {
    position: absolute;
    top: 0;
    left: 0;
    width: max-content;
  }

  #view-graph .graph-zoom-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: max-content;
  }

  .node-rect {
    transition: stroke-width 0.2s, filter 0.2s;
  }

  .node-rect:hover {
    filter: brightness(0.95);
  }

  html.dark .node-rect:hover {
    filter: brightness(1.12);
  }

  .side-panel {
    min-height: 200px;
  }

  #editor-sidebar input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="submit"]):not([type="button"]),
  #editor-sidebar textarea,
  #editor-sidebar select {
    background-color: var(--ui-surface-muted);
    color: var(--ui-ink);
  }

  #editor-sidebar details[open] > summary .accordion-chevron {
    transform: rotate(90deg);
  }
</style>
{% endblock %}

{% block main_class %}w-full max-w-none px-0 py-0{% endblock %}

{% block content %}
<div id="editor-container">
  {% include 'decision_tree/_editor_content.html' %}
</div>

<script src="/static/js/editor.js"></script>
{% endblock %}
