{# Breadcrumb for /docs/* pages. Optional docs_breadcrumb_current for leaf title. #}
<nav class="flex items-center gap-1.5 text-xs text-ui-ink-muted" aria-label="Breadcrumb">
  <a href="/qnr/dashboard" class="hover:text-ui-ink transition-colors">Dashboard</a>
  <span aria-hidden="true">/</span>
  {% if docs_breadcrumb_current|default(none) %}
  <a href="/docs" class="hover:text-ui-ink transition-colors">Docs</a>
  <span aria-hidden="true">/</span>
  <span class="text-ui-ink-secondary">{{ docs_breadcrumb_current }}</span>
  {% else %}
  <span class="text-ui-ink-secondary">Docs</span>
  {% endif %}
</nav>
