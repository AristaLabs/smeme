<svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Remote @import removed so this SVG works as an img src in browsers. -->
  <!-- Transparent background — sits on #1f2937 nav or #111827 canvas -->

  <!-- Fitch vertical line — ink secondary -->
  <line x1="108" y1="60" x2="108" y2="258" stroke="#e5e7eb" stroke-width="1.8" stroke-linecap="square"/>

  <!-- SME — italic, Old Glory red (unchanged, sufficient contrast on dark) -->
  <text
    x="238" y="138"
    font-family="'DM Serif Display', 'Palatino Linotype', Palatino, Georgia, serif"
    font-size="84"
    font-style="italic"
    fill="#BF0A30"
    letter-spacing="3"
    text-anchor="middle">SME</text>

  <!-- Horizontal inference rule — ink secondary -->
  <line x1="108" y1="162" x2="336" y2="162" stroke="#e5e7eb" stroke-width="1.8" stroke-linecap="square"/>

  <!-- Me — upright, ink primary (white) for legibility on dark -->
  <text
    x="198" y="238"
    font-family="'DM Serif Display', 'Palatino Linotype', Palatino, Georgia, serif"
    font-size="84"
    font-style="normal"
    fill="#f9fafb"
    letter-spacing="3"
    text-anchor="middle">Me</text>

  <!-- QED tombstone — solid, ink secondary -->
  <rect x="276" y="188" width="44" height="52" fill="#e5e7eb"/>

</svg>
