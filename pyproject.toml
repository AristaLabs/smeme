[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smeme"]

[project]
name = "smeme-platform"
version = "0.9.0"
description = "SMEme Core — source-available decision-tree platform (fair-code)"
authors = [
    {name = "Arista Labs, LLC", email = "team@smeme.ai"},
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core Framework
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.27",
    "starlette>=1.3.1",
    "jinja2>=3.1.4",
    # Database
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg[binary,pool]>=3.1.0",
    # Auth (Clerk + PyJWT; python-jose removed — unused and pulled unpatched ecdsa)
    "fastapi-users[sqlalchemy]>=15.0.2",
    "fastapi-users-db-sqlmodel>=0.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt[crypto]>=2.13.0",
    "cryptography>=48.0.1",
    # AI/Workflow
    "langgraph>=1.2.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "openai>=1.58.0",
    # Data Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Caching
    "aiocache>=0.12.3",
    # Security (rate limiting)
    "slowapi>=0.1.9",
    # File ingestion (Phase B)
    "pypdf>=6.14.0",
    "python-docx>=1.0.0",
    # Deterministic symbolic reasoning (Z3)
    "z3-solver>=4.13.0",
    "httpx>=0.28.0",
    "tavily-python>=0.7.13",
    "mcp>=1.28.1,<2",
    "clerk-backend-api>=6.0.0",
    "svix>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/AristaLabs/smeme"
Documentation = "https://github.com/AristaLabs/smeme/blob/main/docs/guides/self-host-quickstart.md"
Repository = "https://github.com/AristaLabs/smeme"
Issues = "https://github.com/AristaLabs/smeme/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-alembic>=0.12.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[dependency-groups]
dev = [
    "alembic>=1.16.5",
    "pytest>=8.3.0",
    "pytest-alembic>=0.12.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "enable_rate_limiting: mark test to enable rate limiting",
    "golden_matrix: §8.1 blocking golden-matrix regression rows (PR4b gate)",
]

# ============================================================================
# Linting & Formatting
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py313"
# Allow some line length violations (warn instead of error)
extend-exclude = []

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (Python 3.13+ idioms)
    "ANN",  # flake8-annotations (type hints)
    "ASYNC",# flake8-async
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez (timezone-aware datetimes)
    "T10",  # flake8-debugger
    "EM",   # flake8-errmsg
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
]
ignore = [
    # ANN101 and ANN102 removed from ruff (no longer needed)
    "ANN401",  # Dynamically typed expressions (Any)
    "B008",    # FastAPI Depends() in defaults is a common pattern
    "ANN201",  # Missing return type annotation (fix incrementally)
    "ANN202",  # Missing return type annotation for private functions
    "ANN001",  # Missing type annotation for function arguments (fix incrementally)
    "EM101",   # Exception string literals (fix incrementally)
    "E501",    # Line too long (fix incrementally - many are in HTML templates)
    "SIM105",  # Code simplification suggestions (fix incrementally)
    "SIM102",  # Code simplification suggestions (fix incrementally)
    "SIM108",  # Code simplification suggestions (fix incrementally)
    "N806",    # Variable naming (fix incrementally)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # Don't require type hints in tests
"alembic/versions/*" = ["ALL"]  # Skip linting migration files
"smeme/core/exception_handlers.py" = ["E501"]  # HTML template strings are long
"smeme/decision_tree/editor/routes.py" = ["E501"]  # HTML template strings are long

[tool.ruff.lint.isort]
known-first-party = ["smeme"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ============================================================================
# Type Checking
# ============================================================================

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # FastAPI uses untyped decorators
no_implicit_optional = true
strict_equality = true
warn_no_return = true

# Pydantic plugin for better validation
plugins = ["pydantic.mypy"]

# Exclude patterns
exclude = [
    "^alembic/versions/.*\\.py$",  # Skip migration files
    "^build/",
    "^dist/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false  # Relax for tests

[[tool.mypy.overrides]]
module = [
    "aiocache.*",
    "langgraph.*",
]
ignore_missing_imports = true  # These don't have type stubs yet

